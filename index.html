<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b35"><title>Malati Food Products | Product Price List</title>
<style>
:root{--g:#176b35;--d:#104b29;--ink:#253329;--muted:#68756b;--line:#e3e9df;--bg:#f7f8f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid var(--line);text-align:center;padding:12px 16px 18px}.logo{width:min(100%,370px);max-height:215px;object-fit:contain;display:block;margin:auto}.tagline{font-size:12px;font-weight:750;letter-spacing:.07em;color:var(--d)}main{max-width:1050px;margin:auto;padding:28px 18px 45px}.heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px}h1{font:500 clamp(27px,4vw,36px) Georgia,serif;color:var(--d);margin:0}.count{font-size:12px;color:var(--muted)}.controls{display:grid;grid-template-columns:1fr 220px;gap:10px;margin-bottom:13px}.search,.sort{height:47px;border:1px solid #dce4d8;border-radius:10px;background:white;display:flex;align-items:center;gap:10px;padding:0 13px}.search span,.sort span{font-size:18px;color:var(--g)}input,select{width:100%;border:0;outline:0;background:transparent;font:inherit;color:var(--ink)}.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}.chip{border:1px solid #d9e3d5;border-radius:25px;background:white;color:#526452;padding:8px 12px;font-size:12px;font-weight:650;cursor:pointer}.chip.active,.chip:hover{background:var(--g);color:#fff;border-color:var(--g)}.list{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid #edf0e9}.item:last-child{border:0}.name{font-size:14px;font-weight:650}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px;font-size:11px;color:var(--muted)}.cat{color:#658052;font-weight:700}.price{font-size:17px;color:var(--g);font-weight:800;white-space:nowrap}.empty{text-align:center;padding:35px;color:var(--muted)}.note{text-align:center;font-size:11px;color:#7a8578;margin:15px 0 0}footer{text-align:center;padding:16px;color:#738073;font-size:11px}@media(max-width:560px){.logo{max-height:175px}.tagline{font-size:10px}main{padding:22px 12px 35px}.controls{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column;gap:5px}.item{padding:12px}.name{font-size:13px}.price{font-size:16px}}
</style></head><body>
<header><img class="logo" src="logo.png" alt="Malati Food Products logo"><div class="tagline">Since 1995 &nbsp;•&nbsp; Trusted Quality &nbsp;•&nbsp; Premium Packaging</div></header>
<main><div class="heading"><h1>Product Price List</h1><div class="count" id="count">Loading products…</div></div>
<div class="controls"><label class="search"><span>⌕</span><input id="q" type="search" placeholder="Search products…" aria-label="Search products"></label><label class="sort"><span>↕</span><select id="sort"><option value="default">Sort: Product order</option><option value="low">Price: Low to high</option><option value="high">Price: High to low</option><option value="az">Name: A to Z</option></select></label></div>
<nav class="filters" id="filters" aria-label="Product categories"></nav><section class="list" id="list" aria-live="polite"><div class="empty">Loading catalogue…</div></section><p class="note">Selling prices are shown in Indian Rupees (₹). Please confirm current prices and availability before ordering.</p></main><footer>© Malati Food Products</footer>
<script>
let products=[],active="All Products";const filters=document.getElementById("filters"),list=document.getElementById("list"),q=document.getElementById("q"),sort=document.getElementById("sort");
async function init(){try{const r=await fetch("products.json?v="+Date.now());if(!r.ok)throw Error("Could not load product list");products=await r.json();drawFilters();draw()}catch(e){list.innerHTML='<div class="empty">The product list could not be loaded. Please try again later.</div>';document.getElementById("count").textContent="Catalogue unavailable"}}
function drawFilters(){filters.innerHTML="";["All Products",...new Set(products.map(x=>x.category))].forEach(c=>{let b=document.createElement("button");b.className="chip"+(c===active?" active":"");b.textContent=c;b.type="button";b.onclick=()=>{active=c;drawFilters();draw()};filters.appendChild(b)})}
function draw(){let term=q.value.trim().toLowerCase(),rows=products.filter(p=>(active==="All Products"||p.category===active)&&[p.name,p.category,p.pack].join(" ").toLowerCase().includes(term));if(sort.value==="low")rows.sort((a,b)=>a.price-b.price);if(sort.value==="high")rows.sort((a,b)=>b.price-a.price);if(sort.value==="az")rows.sort((a,b)=>a.name.localeCompare(b.name));document.getElementById("count").textContent=`Showing ${rows.length} of ${products.length} products`;list.innerHTML="";if(!rows.length){list.innerHTML='<div class="empty">No matching products. Try another search.</div>';return}rows.forEach(p=>{let row=document.createElement("article");row.className="item";let left=document.createElement("div"),name=document.createElement("div"),meta=document.createElement("div"),cat=document.createElement("span"),pack=document.createElement("span"),price=document.createElement("div");name.className="name";name.textContent=p.name;meta.className="meta";cat.className="cat";cat.textContent=p.category;pack.textContent=p.pack||"Pack size not specified";meta.append(cat,pack);left.append(name,meta);price.className="price";price.textContent="₹"+Number(p.price).toLocaleString("en-IN");row.append(left,price);list.append(row)})}
q.addEventListener("input",draw);sort.addEventListener("change",draw);init();
</script></body></html>
