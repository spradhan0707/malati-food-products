<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b35"><title>Malati Food Products | Product Price List</title><style>
:root{--g:#176b35;--d:#104b29;--ink:#253329;--muted:#68756b;--line:#e3e9df;--bg:#f7f8f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid var(--line);text-align:center;padding:12px 16px 18px}.logo{width:min(100%,370px);max-height:215px;object-fit:contain;display:block;margin:auto}.tagline{font-size:12px;font-weight:750;letter-spacing:.07em;color:var(--d)}main{max-width:1050px;margin:auto;padding:28px 18px 45px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}h1{font:500 clamp(27px,4vw,36px) Georgia,serif;color:var(--d);margin:0}.count{font-size:12px;color:var(--muted)}.lang{height:38px;border:1px solid #dce4d8;border-radius:9px;background:white;padding:0 10px;color:var(--ink);font:inherit}.controls{display:grid;grid-template-columns:1fr 220px;gap:10px;margin-bottom:13px}.search,.sort{height:47px;border:1px solid #dce4d8;border-radius:10px;background:white;display:flex;align-items:center;gap:10px;padding:0 13px}.search span,.sort span{font-size:18px;color:var(--g)}input,select{width:100%;border:0;outline:0;background:transparent;font:inherit;color:var(--ink)}.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}.chip{border:1px solid #d9e3d5;border-radius:25px;background:white;color:#526452;padding:8px 12px;font-size:12px;font-weight:650;cursor:pointer}.chip.active,.chip:hover{background:var(--g);color:#fff;border-color:var(--g)}.list{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.item{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:13px;align-items:center;padding:11px 16px;border-bottom:1px solid #edf0e9}.thumb,.placeholder{width:66px;height:66px;border-radius:9px;object-fit:contain;background:#f0f3ec;border:1px solid #e8ede4}.placeholder{display:grid;place-items:center;font-size:23px;color:#78906a}.item:last-child{border:0}.name{font-size:14px;font-weight:650}.meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px;font-size:11px;color:var(--muted)}.cat{color:#658052;font-weight:700}.price{font-size:17px;color:var(--g);font-weight:800;white-space:nowrap}.empty{text-align:center;padding:35px;color:var(--muted)}.note{text-align:center;font-size:11px;color:#7a8578;margin:15px 0 0}footer{text-align:center;padding:16px;color:#738073;font-size:11px}@media(max-width:560px){.logo{max-height:175px}.tagline{font-size:10px}main{padding:22px 12px 35px}.controls{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.item{padding:10px;grid-template-columns:54px minmax(0,1fr) auto;gap:9px}.thumb,.placeholder{width:54px;height:54px}.name{font-size:13px}.price{font-size:16px}}
</style></head><body><header><img class="logo" src="logo.png" alt="Malati Food Products logo"><div class="tagline">Since 1995 &nbsp;•&nbsp; Trusted Quality &nbsp;•&nbsp; Premium Packaging</div></header><main><div class="top"><div><h1 id="heading">Product Price List</h1><div class="count" id="count">Loading products…</div></div><select class="lang" id="lang" aria-label="Choose language"><option value="en">English</option><option value="od">ଓଡ଼ିଆ</option><option value="hi">हिन्दी</option></select></div><div class="controls"><label class="search"><span>⌕</span><input id="q" type="search" placeholder="Search products…" aria-label="Search products"></label><label class="sort"><span>↕</span><select id="sort"><option value="default">Sort: Product order</option><option value="low">Price: Low to high</option><option value="high">Price: High to low</option><option value="az">Name: A to Z</option></select></label></div><nav class="filters" id="filters" aria-label="Product categories"></nav><section class="list" id="list" aria-live="polite"><div class="empty">Loading catalogue…</div></section><p class="note" id="note">Selling prices are shown in Indian Rupees (₹). Please confirm current prices and availability before ordering.</p></main><footer>© Malati Food Products</footer><script>
let products=[],active="All Products";const $=id=>document.getElementById(id),filters=$('filters'),list=$('list'),q=$('q'),sort=$('sort'),lang=$('lang');const cats=['All Products','Millets/Rice','Other','Atta','Sattu','Spices'];const tr={en:{heading:'Product Price List',search:'Search products…',sort:'Sort: Product order',low:'Price: Low to high',high:'Price: High to low',az:'Name: A to Z',count:(a,b)=>`Showing ${a} of ${b} products`,pack:'Pack size not specified',empty:'No matching products. Try another search.',note:'Selling prices are shown in Indian Rupees (₹). Please confirm current prices and availability before ordering.',cats:['All Products','Millets/Rice','Other','Atta','Sattu','Spices']},od:{heading:'ଉତ୍ପାଦ ମୂଲ୍ୟ ତାଲିକା',search:'ଉତ୍ପାଦ ଖୋଜନ୍ତୁ…',sort:'କ୍ରମ: ମୂଳ ତାଲିକା',low:'ମୂଲ୍ୟ: କମରୁ ଅଧିକ',high:'ମୂଲ୍ୟ: ଅଧିକରୁ କମ',az:'ନାମ: A ରୁ Z',count:(a,b)=>`${b} ରୁ ${a} ଟି ଉତ୍ପାଦ ଦେଖାଯାଉଛି`,pack:'ପ୍ୟାକ୍ ଆକାର ଉଲ୍ଲେଖ ନାହିଁ',empty:'କୌଣସି ଉତ୍ପାଦ ମିଳିଲା ନାହିଁ। ଅନ୍ୟ ଶବ୍ଦ ଖୋଜନ୍ତୁ।',note:'ମୂଲ୍ୟ ଭାରତୀୟ ଟଙ୍କାରେ (₹) ଦର୍ଶାଯାଇଛି। ଅର୍ଡର ପୂର୍ବରୁ ମୂଲ୍ୟ ଓ ଉପଲବ୍ଧତା ନିଶ୍ଚିତ କରନ୍ତୁ।',cats:['ସମସ୍ତ ଉତ୍ପାଦ','ମିଲେଟ୍ / ଚାଉଳ','ଅନ୍ୟାନ୍ୟ','ଅଟା','ଚାଟୁଆ','ମସଲା']},hi:{heading:'उत्पाद मूल्य सूची',search:'उत्पाद खोजें…',sort:'क्रम: मूल सूची',low:'कीमत: कम से अधिक',high:'कीमत: अधिक से कम',az:'नाम: A से Z',count:(a,b)=>`${b} में से ${a} उत्पाद दिखाए जा रहे हैं`,pack:'पैक आकार उपलब्ध नहीं',empty:'कोई उत्पाद नहीं मिला। दूसरा शब्द खोजें।',note:'कीमतें भारतीय रुपये (₹) में हैं। ऑर्डर से पहले कीमत और उपलब्धता की पुष्टि करें।',cats:['सभी उत्पाद','मिलेट्स / चावल','अन्य','आटा','सत्तू','मसाले']}};
const catKey={'Millets/Rice':'Millets/Rice','Other':'Other','Atta':'Atta','Sattu':'Sattu','Spices':'Spices'};function labelCat(c){let i=cats.indexOf(c);return tr[lang.value].cats[i]||c}function nameOf(p){return (lang.value==='od'?p.nameOd:lang.value==='hi'?p.nameHi:p.name)||p.name}function init(){fetch('products.json?v='+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{products=x;drawFilters();applyLang();draw()}).catch(()=>{list.innerHTML='<div class="empty">Catalogue unavailable. Please try again later.</div>';$('count').textContent='Catalogue unavailable'})}function drawFilters(){filters.innerHTML='';cats.forEach((c,i)=>{let b=document.createElement('button');b.className='chip'+(c===active?' active':'');b.type='button';b.textContent=tr[lang.value].cats[i];b.onclick=()=>{active=c;drawFilters();draw()};filters.appendChild(b)})}function applyLang(){let t=tr[lang.value];document.documentElement.lang=lang.value==='od'?'or':lang.value;$('heading').textContent=t.heading;q.placeholder=t.search;q.setAttribute('aria-label',t.search);let opts=sort.options;[t.sort,t.low,t.high,t.az].forEach((v,i)=>opts[i].textContent=v);$('note').textContent=t.note;drawFilters()}function draw(){let term=q.value.trim().toLowerCase(),rows=products.filter(p=>(active==='All Products'||p.category===active)&&[p.name,nameOf(p),p.category,p.pack].join(' ').toLowerCase().includes(term));if(sort.value==='low')rows.sort((a,b)=>a.price-b.price);if(sort.value==='high')rows.sort((a,b)=>b.price-a.price);if(sort.value==='az')rows.sort((a,b)=>nameOf(a).localeCompare(nameOf(b)));$('count').textContent=tr[lang.value].count(rows.length,products.length);list.innerHTML='';if(!rows.length){list.innerHTML='<div class="empty">'+tr[lang.value].empty+'</div>';return}rows.forEach(p=>{let row=document.createElement('article');row.className='item';let visual;if(p.image){visual=document.createElement('img');visual.className='thumb';visual.src=p.image;visual.alt=nameOf(p);visual.loading='lazy';visual.onerror=()=>{let ph=document.createElement('div');ph.className='placeholder';ph.textContent='🌾';visual.replaceWith(ph)}}else{visual=document.createElement('div');visual.className='placeholder';visual.textContent='🌾'}let left=document.createElement('div'),name=document.createElement('div'),meta=document.createElement('div'),cat=document.createElement('span'),pack=document.createElement('span'),price=document.createElement('div');name.className='name';name.textContent=nameOf(p);meta.className='meta';cat.className='cat';cat.textContent=lang.value==='od'?(p.categoryOd||labelCat(p.category)):lang.value==='hi'?(p.categoryHi||labelCat(p.category)):p.category;pack.textContent=p.pack||tr[lang.value].pack;meta.append(cat,pack);left.append(name,meta);price.className='price';price.textContent='₹'+Number(p.price).toLocaleString('en-IN');row.append(visual,left,price);list.append(row)})}q.addEventListener('input',draw);sort.addEventListener('change',draw);lang.addEventListener('change',()=>{applyLang();draw()});init();</script></body></html>
